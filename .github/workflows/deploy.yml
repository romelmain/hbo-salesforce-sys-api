name: Build and Deploy to dev !!

on:
  push:
    branches: [ actions ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v3
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: 17
    - name: Build with Maven
      run: mvn -B package -DskipMunitTests

    - name: Debug artifact generation
      run: ls -l target

    - name: Stamp artifact file name with commit hash
      run: |
        artifactName1=$(ls target/*.jar | head -1)
        if [ -z "$artifactName1" ]; then
          echo "No artifact found in target/ directory"
          exit 1
        fi
        commitHash=$(git rev-parse --short "$GITHUB_SHA")
        artifactName2=$(echo "$artifactName1" | sed "s/.jar/-$commitHash.jar/g")
        mv "$artifactName1" "$artifactName2"
        echo "Renamed $artifactName1 to $artifactName2"


          
 